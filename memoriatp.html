<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memoria Activa — 50 Años</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">🕊️ Memoria Activa</a>
    </div>
  </nav>

  <!-- Hero -->
  <section class="hero text-white bg-secondary text-center py-5">
    <h1>50 años. Memoria, Verdad y Justicia.</h1>
    <p id="contador-anios" class="fs-4"></p>
    <a href="#adhesion" class="btn btn-light">Sumate</a>
  </section>

  <!-- Testimonios -->
  <section id="testimonios" class="py-5 bg-light">
    <div class="container">
      <h2 class="mb-4">Archivo de Testimonios</h2>
      <input id="buscador" class="form-control mb-4" placeholder="Buscar testimonios...">
      <div class="row g-4" id="lista-testimonios">
        <div class="col-md-4 testimonio">
          <div class="card p-3 h-100">
            <p>"Nunca más el silencio. Memoria activa, presente y futuro."</p>
          </div>
        </div>
        <div class="col-md-4 testimonio">
          <div class="card p-3 h-100">
            <p>"La búsqueda que no cesa."</p>
          </div>
        </div>
        <div class="col-md-4 testimonio">
          <div class="card p-3 h-100">
            <p>"Por la verdad y la justicia de nuestros compañeros."</p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Generador de tarjeta -->
  <section id="tarjeta" class="py-5">
    <div class="container text-center">
      <h2>Generá tu Tarjeta Conmemorativa</h2>
      <div class="col-md-6 mx-auto">
        <input id="mensaje-tarjeta" class="form-control mb-3" placeholder="Tu mensaje reflexivo...">
        <button id="btn-generar" class="btn btn-primary mb-3">Generar tarjeta</button>
        <div id="tarjeta-resultado"></div>
      </div>
    </div>
  </section>

  <!-- Formulario de adhesión -->
  <section id="adhesion" class="py-5 bg-dark text-white">
    <div class="container text-center">
      <h2>Formulario de Adhesión</h2>
      <form id="form-adhesion" class="col-md-6 mx-auto">
        <div class="input-group mb-3">
          <input id="nombre-adhesion" class="form-control" placeholder="Tu nombre y apellido">
          <button type="submit" class="btn btn-warning">Sumarme</button>
        </div>
        <p id="msg-adhesion"></p>
      </form>
    </div>
  </section>

  <script src="main.js"></script>
</body>
</html>
